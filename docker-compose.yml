services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bulk-actions-table:latest
    container_name: bulk-actions-table
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    # Uncomment to load additional variables from a local file (not committed to git):
    # env_file:
    #   - .env.local
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
